name: Windows build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build, test and publish
        shell: pwsh
        run: ./build.ps1 -Portable -OutputDirectory artifacts/release-1.0.4
      - name: Check renamed assemblies and compatibility
        shell: pwsh
        run: |
          dotnet tests/TD_Wallpaper.UiTests/bin/Release/net10.0-windows/TD_Wallpaper.UiTests.dll --naming
          if ($LASTEXITCODE -ne 0) { throw 'Naming compatibility checks failed.' }
      - uses: actions/upload-artifact@v4
        with:
          name: TD_Wallpaper-1.0.4-win-x64-build
          path: artifacts/release-1.0.4
          if-no-files-found: error
          retention-days: 14
