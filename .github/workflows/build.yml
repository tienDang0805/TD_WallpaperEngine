name: Windows build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build, test and publish
        shell: pwsh
        run: ./build.ps1 -Portable -OutputDirectory artifacts/release-1.0.2
      - uses: actions/upload-artifact@v4
        with:
          name: TD-WallpaperEngine-1.0.2-win-x64-build
          path: artifacts/release-1.0.2
          if-no-files-found: error
          retention-days: 14